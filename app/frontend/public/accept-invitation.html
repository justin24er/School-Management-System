<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accept Invitation — The School Management App</title>
    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="stylesheet" href="/css/auth-overrides.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
</head>
<body>
    <section class="login-section">
        <form id="accept-form">
            <header class="secondary-header-form">
                <p class="heading">Accept Your Invitation</p>
                <p class="header-des">Set up your account to join your school</p>
            </header>
            <div class="username">
                <p class="username-title">Choose a Username</p>
                <input type="text" id="accept-username" required />
            </div>
            <div class="passwd-confirm">
                <div class="passwd">
                    <p class="passwd-title">Password</p>
                    <input type="password" id="accept-password" class="input-passwd" required />
                </div>
                <div class="confirm">
                    <p class="confirm-title">Confirm Password</p>
                    <input type="password" id="accept-confirm" class="input-passwd" required />
                </div>
            </div>
            <div class="showpasswd">
                <input type="checkbox" id="accept-show" />
                <span>Show password</span>
            </div>
            <div class="error-display" id="accept-error"></div>
            <div class="success-display" id="accept-success"></div>
            <button type="submit" class="register-btn">Create Account</button>
        </form>
    </section>

    <script src="/js/api.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const errorEl = document.getElementById('accept-error');
        const successEl = document.getElementById('accept-success');

        document.getElementById('accept-show').addEventListener('change', (e) => {
            document.querySelectorAll('.input-passwd').forEach(i => i.type = e.target.checked ? 'text' : 'password');
        });

        document.getElementById('accept-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.textContent = '';
            if (!token) { errorEl.textContent = 'This invitation link is missing its token.'; return; }
            const password = document.getElementById('accept-password').value;
            const confirm = document.getElementById('accept-confirm').value;
            if (password !== confirm) { errorEl.textContent = 'Passwords do not match.'; return; }
            try {
                await API.post('/api/onboarding/invitations/accept', {
                    token, username: document.getElementById('accept-username').value, password,
                });
                successEl.textContent = 'Account created. Redirecting to login...';
                setTimeout(() => window.location.href = '/index.html', 1500);
            } catch (err) {
                errorEl.textContent = err.message;
            }
        });
    </script>
</body>
</html>
