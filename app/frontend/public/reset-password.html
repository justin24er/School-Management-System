<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — The School Management App</title>
    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="stylesheet" href="/css/auth-overrides.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
</head>
<body>
    <section class="login-section">
        <form id="reset-form">
            <header class="secondary-header-form">
                <p class="heading">Reset Your Password</p>
                <p class="header-des">Choose a new password for your account</p>
            </header>
            <div class="passwd-confirm">
                <div class="passwd">
                    <p class="passwd-title">New Password</p>
                    <input type="password" id="reset-password" class="input-passwd" required />
                </div>
                <div class="confirm">
                    <p class="confirm-title">Confirm Password</p>
                    <input type="password" id="reset-confirm" class="input-passwd" required />
                </div>
            </div>
            <div class="showpasswd">
                <input type="checkbox" id="reset-show" />
                <span>Show password</span>
            </div>
            <div class="error-display" id="reset-error"></div>
            <div class="success-display" id="reset-success"></div>
            <button type="submit" class="register-btn">Update Password</button>
        </form>
    </section>

    <script src="/js/api.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const errorEl = document.getElementById('reset-error');
        const successEl = document.getElementById('reset-success');

        document.getElementById('reset-show').addEventListener('change', (e) => {
            document.querySelectorAll('.input-passwd').forEach(i => i.type = e.target.checked ? 'text' : 'password');
        });

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.textContent = '';
            if (!token) { errorEl.textContent = 'This reset link is missing its token.'; return; }
            const newPassword = document.getElementById('reset-password').value;
            const confirm = document.getElementById('reset-confirm').value;
            if (newPassword !== confirm) { errorEl.textContent = 'Passwords do not match.'; return; }
            try {
                await API.post('/api/auth/reset-password', { token, newPassword });
                successEl.textContent = 'Password updated. Redirecting to login...';
                setTimeout(() => window.location.href = '/index.html', 1500);
            } catch (err) {
                errorEl.textContent = err.message;
            }
        });
    </script>
</body>
</html>
